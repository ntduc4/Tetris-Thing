[project]
name = "tetris-ai"
version = "0.1.0"
description = ""
authors = [
    {name = "Nguyen Thien Duc",email = "ntduc@pm.me"}
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "marimo (>=0.25.2,<0.26.0)",
    "torch (==2.12.1+rocm7.1)",
    "triton-rocm (==3.7.1)",
    "numpy (>=2.3,<3.0)",
    "pillow (>=11,<13)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.1"
priority = "explicit"

[tool.poetry.dependencies]
torch = {source = "pytorch-rocm"}
triton-rocm = {source = "pytorch-rocm"}

[dependency-groups]
dev = [
    "pybind11-stubgen (>=3.0.0,<4.0.0)",
    "pybind11 (>=3.1.0,<4.0.0)"
]
